services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    command:
      - postgres
      - -c
      - maintenance_work_mem=1GB
    environment:
      POSTGRES_DB: memory_vault
      POSTGRES_USER: memory_vault
      POSTGRES_PASSWORD: ${MV_DB_PASSWORD:-memory_vault}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "${MV_DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U memory_vault -d memory_vault"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    # Default: the upstream memory-vault image (MIT, MihaiBuilds).
    # To pin your own mirror, set MV_APP_IMAGE in .env
    # (e.g. MV_APP_IMAGE=ghcr.io/romanlatypov/vault-engine:1.0.1 once pushed).
    image: ${MV_APP_IMAGE:-ghcr.io/mihaibuilds/memory-vault:1.0.1}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${MV_PORT:-8000}:8000"
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: memory_vault
      DB_USER: memory_vault
      DB_PASSWORD: ${MV_DB_PASSWORD:-memory_vault}
      API_HOST: 0.0.0.0
      API_PORT: 8000
      API_AUTH_ENABLED: "true"
      API_CORS_ORIGINS: "*"
      API_RATE_LIMIT_PER_MIN: "120"
      LOG_LEVEL: "INFO"
    volumes:
      - app_logs:/var/log/memory-vault

volumes:
  pgdata:
  app_logs:
